---
name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: "read"

env:
  UV_LOCKED: "1"

jobs:
  lint-and-test:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e"  # v10.3.2
      - name: "Lint"
        run: "make lint"
      - name: "Install tmux, for the plugin tests"
        run: "sudo apt-get update && sudo apt-get install -y tmux"
      - name: "Unit tests"
        run: "make test"
      - name: "Every pre-commit check, on every file"
        run: "uvx --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure"

  packages:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    needs: "lint-and-test"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The packages are built outside the checkout, in XDG_CACHE_HOME: here the
      # runner's temporary directory, collected from there. A step, since a job's
      # env cannot read the runner context.
      - name: "Build outside the checkout"
        run: "echo \"XDG_CACHE_HOME=$RUNNER_TEMP/cache\" >> \"$GITHUB_ENV\""
      - name: "Build and check the packages"
        run: "make deb-check"
      - name: "The deb battery: maintainer-script failure paths, per package"
        run: "make deb-battery"
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "debs"
          path: "${{ runner.temp }}/cache/dictate/*/dist/*.deb"
