---
name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: "read"

env:
  UV_LOCKED: "1"

jobs:
  lint-and-test:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7"  # v10.2.0
      - name: "Lint"
        run: "make lint"
      - name: "Install tmux, for the plugin tests"
        run: "sudo apt-get update && sudo apt-get install -y tmux"
      - name: "Unit tests"
        run: "make test"

  packages:
    runs-on: "ubuntu-24.04"
    needs: "lint-and-test"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Build and check the packages"
        run: "make deb-check"
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "debs"
          path: "*/dist/*.deb"
